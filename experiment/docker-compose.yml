# Rollback-loss experiment: monolith + extracted account-service behind one Nginx.
# Reconstruction of the thesis stage "account module extracted, monolith still running".
# Monolith: this repo (6c68e98 + userId claim). Services: banking-microservice@4f077f2.
# One PostgreSQL, one database (banking_db), as in thesis §3.2.
name: rollback-exp

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  monolith:
    build: ..
    environment:
      DB_URL: jdbc:postgresql://db:5432/banking_db
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGp3dA==}
    depends_on:
      - db

  account-service:
    build:
      context: ../services
      dockerfile: account-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/banking_db
      DB_USERNAME: postgres
      DB_PASSWORD: "1234"
    depends_on:
      - db

  api-gateway:
    build:
      context: ../services
      dockerfile: api-gateway/Dockerfile
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8082
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIGp3dA==}
    depends_on:
      - account-service

  # switch-blue-green.sh copies nginx.<target>.conf over nginx/nginx.conf and reloads
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - monolith
      - api-gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Workload / verification client (stdlib Python). Started only via `docker compose run`.
  harness:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /harness
    volumes:
      - ./harness:/harness:ro
      - ./results:/results
    entrypoint: ["python", "-u", "/harness/rollback.py"]

volumes:
  postgres_data:
